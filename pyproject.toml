[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "incidentrag"
version = "0.1.0"
description = "Production-grade incident response RAG system"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.40.0",
    "httpx>=0.27.0",
    "fastapi>=0.112.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    "pydantic>=2.5",
    "pydantic-settings>=2.3.0",
    "scipy>=1.13.0",
    "numpy>=1.26.0",
    "typer>=0.12.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
    "python-dotenv>=1.0.1",
    "diskcache>=5.6.3",
    "orjson>=3.10.0",
    "qdrant-client>=1.11.0,<1.12.0",
    "neo4j>=5.23.0,<6.0.0",
    "redis>=5.0.8",
    "tiktoken>=0.7.0",
    "rank-bm25>=0.2.2",
    "opentelemetry-sdk>=1.26.0",
    "opentelemetry-exporter-otlp>=1.26.0",
]

[project.optional-dependencies]
ui = [
    "streamlit>=1.37.0",
]
reranker = [
    "sentence-transformers>=3.1.0",
]
evaluation = [
    "datasets>=2.20.0",
    "pandas>=2.2.0",
    "ragas>=0.1.14",
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.23.8",
    "pytest-cov>=5.0.0",
    "mypy>=1.11.0",
    "ruff>=0.6.0",
]

[project.scripts]
incidentrag = "incidentrag.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentrag"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=src/incidentrag --cov-report=term-missing --cov-report=xml"

[tool.coverage.run]
source = ["src/incidentrag"]
omit = ["*/tests/*"]
